# Runs on every push/PR so regressions (broken build, failing tests, docs
# that drift from the schema) are caught before a tag is ever cut.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -timeout 60s
      - name: Check generated docs are up to date
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.25.0 generate
          git diff --exit-code -- docs/ || (echo "::error::docs/ is stale, run 'make docs' and commit the result" && exit 1)
