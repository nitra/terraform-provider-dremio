# Runs on every push/PR so regressions (broken build, failing tests, docs
# that drift from the schema) are caught before a tag is ever cut.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -timeout 60s
      - name: Set up OpenTofu for isolated RBAC acceptance
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Test RBAC roles, memberships, grants and ownership on local fixture
        run: |
          set -eu
          tofu_binary="$(command -v tofu)"
          test -x "$tofu_binary"
          TOFU_RBAC_BINARY="$tofu_binary" go test ./dremio -run '^Test(Role|Membership|Grant|Ownership)OpenTofuLifecycle$' -count=1 -timeout 120s
      - name: Check generated docs are up to date
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.25.0 generate --provider-name dremio --rendered-provider-name terraform-provider-dremio
          git diff --exit-code -- docs/ || (echo "::error::docs/ is stale, run 'make docs' and commit the result" && exit 1)
