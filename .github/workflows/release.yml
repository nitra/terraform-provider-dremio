# Publishes GitHub Release assets (cross-platform zips + SHA256SUMS) for any
# tag matching "v*" (e.g. v0.1.0). Consumed via a filesystem/network mirror,
# not the public Terraform/OpenTofu registry, so no GPG signing is required.
name: release
on:
  push:
    tags:
      - 'v*'
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}